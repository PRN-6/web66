<!DOCTYPE html>
<html lang="en" class="bg-black text-white selection:bg-neutral-800">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web66 — Cosmic Codebase Intelligence</title>
  
  <!-- Fonts: Silkscreen + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace'],
            pixel: ['"Silkscreen"', 'monospace'],
          },
          colors: {
            brand: {
              gold: '#fbbf24',
              cyan: '#38bdf8',
              emerald: '#34d399',
              purple: '#c084fc',
              indigo: '#818cf8',
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="/style.css">
</head>
<body class="w-screen h-screen overflow-hidden bg-black text-[#8c8c8c] font-mono select-none">

  <!-- Deep Space Canvas -->
  <canvas id="galaxy-canvas" class="absolute inset-0 w-full h-full z-0 cursor-grab active:cursor-grabbing touch-none"></canvas>

  <!-- Top HUD Bar -->
  <header class="hud-header absolute top-4 left-5 right-5 h-14 flex items-center justify-between px-4 bg-black/90 backdrop-blur-md border border-[#1a1a1a] rounded-xl z-20 shadow-2xl">
    
    <!-- Brand Logo -->
    <div class="brand flex items-center gap-3">
      <div class="brand-orb relative w-7 h-7 flex items-center justify-center">
        <span class="orb-core w-2.5 h-2.5 rounded-full bg-white shadow-[0_0_10px_#ffffff]"></span>
        <span class="orb-ring absolute inset-0 border border-dashed border-white/40 rounded-full"></span>
      </div>
      <div class="flex flex-col">
        <div class="flex items-center gap-2">
          <span class="font-pixel text-sm text-white tracking-widest">web66</span>
          <span class="text-[9px] font-bold px-1.5 py-0.2 bg-white text-black rounded font-mono">COSMOS</span>
        </div>
        <div class="text-[10px] text-[#555555] max-w-[200px] truncate" id="project-path-display">Scanning workspace...</div>
      </div>
    </div>

    <!-- Center Search & Filters -->
    <div class="hud-center hidden md:flex items-center gap-3 flex-1 max-w-xl mx-4">
      
      <!-- Search Input -->
      <div class="search-box flex items-center px-3 h-9 flex-1 bg-[#0a0a0a] border border-[#1f1f1f] focus-within:border-neutral-500 rounded-lg text-xs transition-colors">
        <svg class="w-3.5 h-3.5 text-[#555555] mr-2 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="node-search" placeholder="Search symbols, functions, files..." class="bg-transparent border-none outline-none text-white text-xs w-full font-mono placeholder:text-[#555555]" autocomplete="off">
        <span class="text-[10px] text-[#555555] border border-[#262626] bg-[#050505] px-1.5 py-0.5 rounded shrink-0">⌘K</span>
      </div>

      <!-- Filter Pills -->
      <div class="filter-pills flex items-center gap-1.5">
        <button class="pill active px-2.5 py-1 text-xs font-mono rounded-md border transition-all" data-filter="all">All</button>
        <button class="pill px-2.5 py-1 text-xs font-mono rounded-md border transition-all" data-filter="File">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-brand-cyan shadow-[0_0_6px_#38bdf8] mr-1"></span>Files
        </button>
        <button class="pill px-2.5 py-1 text-xs font-mono rounded-md border transition-all" data-filter="Function">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-brand-emerald shadow-[0_0_6px_#34d399] mr-1"></span>Functions
        </button>
        <button class="pill px-2.5 py-1 text-xs font-mono rounded-md border transition-all" data-filter="Class">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-brand-purple shadow-[0_0_6px_#c084fc] mr-1"></span>Classes
        </button>
        <button class="pill px-2.5 py-1 text-xs font-mono rounded-md border transition-all" data-filter="Type">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-brand-indigo shadow-[0_0_6px_#818cf8] mr-1"></span>Types
        </button>
      </div>
    </div>

    <!-- Right HUD: Status & Stats -->
    <div class="hud-right flex items-center gap-2.5">
      <div class="status-pill flex items-center gap-2 px-2.5 py-1 bg-[#0a0a0a] border border-[#1f1f1f] rounded-lg text-[11px] font-mono text-white" id="status-pill">
        <span class="status-beacon w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
        <span class="status-text font-bold" id="status-text">CONNECTING...</span>
      </div>

      <div class="stats-badge px-2.5 py-1 bg-[#0a0a0a] border border-[#1f1f1f] rounded-lg text-[11px] font-mono text-[#888888]">
        <span id="node-count" class="text-white font-bold">0</span> nodes <span class="text-[#444444]">•</span> <span id="edge-count" class="text-white font-bold">0</span> edges
      </div>
    </div>
  </header>

  <!-- Floating Left Canvas Controls -->
  <aside class="floating-controls absolute left-5 top-24 flex flex-col p-1.5 gap-1.5 bg-black/90 backdrop-blur-md border border-[#1a1a1a] rounded-xl z-20 shadow-xl">
    <button class="control-btn w-9 h-9 rounded-lg bg-[#0a0a0a] border border-[#1c1c1c] hover:bg-[#181818] hover:border-[#333333] flex items-center justify-center text-neutral-400 hover:text-white transition-all" id="btn-zoom-in" title="Zoom In (+)">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <button class="control-btn w-9 h-9 rounded-lg bg-[#0a0a0a] border border-[#1c1c1c] hover:bg-[#181818] hover:border-[#333333] flex items-center justify-center text-neutral-400 hover:text-white transition-all" id="btn-zoom-out" title="Zoom Out (-)">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <button class="control-btn w-9 h-9 rounded-lg bg-[#0a0a0a] border border-[#1c1c1c] hover:bg-[#181818] hover:border-[#333333] flex items-center justify-center text-neutral-400 hover:text-white transition-all" id="btn-center" title="Center Core Node">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
    </button>
    <button class="control-btn w-9 h-9 rounded-lg bg-[#0a0a0a] border border-[#1c1c1c] hover:bg-[#181818] hover:border-[#333333] flex items-center justify-center text-neutral-400 hover:text-white transition-all active" id="btn-layout" title="Toggle Layout: Radial Web / Organic Physics">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
    </button>
    <button class="control-btn w-9 h-9 rounded-lg bg-[#0a0a0a] border border-[#1c1c1c] hover:bg-[#181818] hover:border-[#333333] flex items-center justify-center text-neutral-400 hover:text-white transition-all active" id="btn-particles" title="Toggle Energy Particles">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
    </button>
  </aside>

  <!-- Legend in bottom left -->
  <div class="legend-panel absolute bottom-5 left-5 p-3.5 bg-black/90 backdrop-blur-md border border-[#1a1a1a] rounded-xl z-20 shadow-xl">
    <div class="text-[10px] font-bold text-[#555555] tracking-widest mb-2">COSMIC ENTITIES</div>
    <div class="flex flex-col gap-1.5 text-xs text-[#888888]">
      <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-brand-gold shadow-[0_0_8px_#fbbf24]"></span> Core / Entry File</div>
      <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-brand-cyan shadow-[0_0_8px_#38bdf8]"></span> File / Module</div>
      <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-brand-emerald shadow-[0_0_8px_#34d399]"></span> Function</div>
      <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-brand-purple shadow-[0_0_8px_#c084fc]"></span> Class</div>
      <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-brand-indigo shadow-[0_0_8px_#818cf8]"></span> Type / Interface</div>
    </div>
  </div>

  <!-- Inspector Drawer (Right Side) -->
  <aside class="inspector-drawer absolute top-20 right-5 bottom-5 w-88 bg-black/95 backdrop-blur-md border border-[#1a1a1a] rounded-xl flex flex-col z-20 shadow-2xl transition-all" id="inspector-drawer">
    
    <div class="flex items-center justify-between p-4 border-b border-[#1a1a1a] bg-[#050505]">
      <div class="text-[10px] font-bold tracking-wider text-white bg-[#141414] border border-[#292929] px-2 py-0.5 rounded" id="inspector-type">NODE INSPECTOR</div>
      <button class="text-neutral-500 hover:text-white text-lg font-mono leading-none" id="inspector-close">×</button>
    </div>

    <div class="inspector-body p-4 overflow-y-auto flex-1 flex flex-col gap-3.5" id="inspector-content">
      <div class="flex flex-col items-center justify-center h-full text-center text-[#555555] gap-3">
        <div class="text-3xl">🪐</div>
        <div class="text-xs max-w-[220px] leading-relaxed">Select any blob in the cosmic web to inspect its architectural connections and symbols.</div>
      </div>
    </div>

  </aside>

  <script src="/app.js"></script>
</body>
</html>
